<section data-section="details" id="details" class="v2-sec" data-tone="light" style="--h:740px; background:#F5F7FA;">
<style>
  [data-section="details"] p, [data-section="details"] h2, [data-section="details"] h3 { margin: 0; }
  [data-section="details"] .cd-col { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 20px; align-items: flex-start; padding: 96px 20px 88px; }
  [data-section="details"] h2 { width: 350px; font-weight: 400; font-size: 40px; line-height: 1.02; letter-spacing: -0.04em; color: #0F1115; }
  [data-section="details"] .cd-lede { width: 320px; font-weight: 300; font-size: 16px; line-height: 1.55; color: rgba(15,17,21,.62); }
  [data-section="details"] .cd-card { width: 350px; margin-top: 8px; padding: 24px 24px 12px; border-radius: 26px; background: #fff; box-shadow: 0 30px 60px rgba(15,20,64,.1); }
  [data-section="details"] .cd-card h3 { margin-bottom: 12px; font-weight: 400; font-size: 13px; line-height: normal; color: #5C6373; }
  [data-section="details"] .cd-card dl { margin: 0; }
  [data-section="details"] .cd-row { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border-top: 1px solid #E3E8F0; font-size: 15px; line-height: normal; }
  [data-section="details"] .cd-row dt { font-weight: 300; font-size: 13px; color: #5C6373; }
  [data-section="details"] .cd-row dd { margin: 0; font-weight: 400; color: #0F1115; }
  /* Placeholder values: clearly marked until Fintegre supplies the approved details. */
  [data-section="details"] .cd-ph { color: #8A93A3; border-bottom: 1px dashed rgba(138,147,163,.6); }
  [data-section="details"] .cd-btn { display: inline-flex; align-items: center; height: 48px; margin-top: 12px; padding: 0 22px; border-radius: 999px; background: #0F1115; color: #F5F7FA; font-size: 15px; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .motion [data-section="details"] [data-m="up"] { translate: 0 var(--ty, 30px); }
  .motion [data-section="details"].is-in [data-m] { translate: none; }
</style>
  <div class="v2-canvas">
    <div class="cd-col">
      <h2 data-m="up" style="--d:100ms">Company details.</h2>
      <p class="cd-lede" data-m="up" style="--d:200ms">Registered company information and how to reach us about a program.</p>
      <div class="cd-card" data-m="up" style="--d:300ms">
        <h3>Legal entity and contact</h3>
        <dl>
          <div class="cd-row"><dt>Legal entity</dt><dd><span class="cd-ph">[Legal entity name]</span></dd></div>
          <div class="cd-row"><dt>Registered address</dt><dd><span class="cd-ph">[Registered address]</span></dd></div>
          <div class="cd-row"><dt>Company registration number</dt><dd><span class="cd-ph">[Company registration number]</span></dd></div>
          <div class="cd-row"><dt>Contact</dt><dd><span class="cd-ph">[Contact e-mail]</span></dd></div>
        </dl>
      </div>
      <a href="/v2/contact/" class="cd-btn" data-m="up" style="--d:400ms">Discuss your program</a>
    </div>
  </div>
</section>
