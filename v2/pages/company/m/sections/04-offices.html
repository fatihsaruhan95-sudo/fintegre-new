<section data-section="offices" id="offices" class="v2-sec" data-tone="light" style="--h:1124px; background:#F5F7FA;">
<style>
  [data-section="offices"] p, [data-section="offices"] h2 { margin: 0; }
  [data-section="offices"] .co-col { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 20px; align-items: flex-start; padding: 96px 20px 88px; }
  [data-section="offices"] h2 { width: 350px; font-weight: 400; font-size: 36px; line-height: 1.04; letter-spacing: -0.04em; color: #0F1115; }
  [data-section="offices"] .co-lede { width: 330px; font-weight: 300; font-size: 16px; line-height: 1.55; color: rgba(15,17,21,.62); }
  [data-section="offices"] .co-how { width: 350px; }
  [data-section="offices"] .co-how__k { font-size: 14px; line-height: normal; color: rgba(15,17,21,.55); }
  [data-section="offices"] .co-chips { margin-top: 13px; width: 350px; display: flex; flex-wrap: wrap; gap: 8px; }
  [data-section="offices"] .co-chip { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border: 0; border-radius: 999px; background: #0F1115; color: #F5F7FA;
    font: 400 14px/normal 'Geologica', system-ui, sans-serif; white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color .25s; }
  [data-section="offices"] .co-chip img { width: 7px; height: 7px; display: block; }
  [data-section="offices"] .co-chip[aria-pressed="true"] { background: #3047EC; }
  [data-section="offices"] .co-note { margin-top: 12px; font-weight: 300; font-size: 14px; line-height: 1.5; color: rgba(15,17,21,.62); }
  [data-section="offices"] .co-list { width: 350px; display: flex; flex-direction: column; gap: 16px; }
  [data-section="offices"] .co-office { width: 100%; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; padding: 24px; border: 0; border-radius: 24px; background: #fff; text-align: left;
    box-shadow: 0 16px 40px rgba(15,18,51,.07); font-family: inherit; line-height: normal; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  [data-section="offices"] .co-office__l { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; font-weight: 300; }
  [data-section="offices"] .co-office__city { font-size: 40px; letter-spacing: -0.03em; color: #0F1115; white-space: nowrap; }
  [data-section="offices"] .co-office__what { font-size: 15px; color: rgba(15,17,21,.6); }
  [data-section="offices"] .co-office__r { display: flex; gap: 16px; align-items: center; white-space: nowrap; }
  [data-section="offices"] .co-time { font-size: 15px; color: rgba(15,17,21,.7); font-variant-numeric: tabular-nums; transition: color .3s; }
  [data-section="offices"] .co-office[aria-pressed="true"] .co-time { color: #3047EC; }
  [data-section="offices"] .co-people { font-weight: 300; font-size: 14px; color: rgba(15,17,21,.5); }
  .motion [data-section="offices"] [data-m="up"] { translate: 0 var(--ty, 30px); }
  .motion [data-section="offices"].is-in [data-m] { translate: none; }
</style>
  <div class="v2-canvas">
    <div class="co-col">
      <h2 data-m="up" style="--d:100ms">Three offices,<br>one team.</h2>
      <p class="co-lede" data-m="up" style="--d:200ms">Product and engineering sit in Vilnius. Partnerships and operations sit close to the markets they serve.</p>
      <div class="co-how" data-m="up" style="--d:300ms">
        <p class="co-how__k">How we work</p>
        <div class="co-chips" role="group" aria-label="How we work">
        <button type="button" class="co-chip" aria-pressed="true" data-note="Every team is five to seven people, and every metric has one name next to it."><img alt="" src="/v2/assets/company-dot-ice7.svg">Small teams, clear owners</button>
        <button type="button" class="co-chip" aria-pressed="false" data-note="Decisions live in short written docs, so Vilnius, Warsaw and Riga read the same thing."><img alt="" src="/v2/assets/company-dot-ice7.svg">Write it down</button>
        <button type="button" class="co-chip" aria-pressed="false" data-note="We count success in devices checked, valued and paid, not in features shipped."><img alt="" src="/v2/assets/company-dot-ice7.svg">Measure in devices</button>
        <button type="button" class="co-chip" aria-pressed="false" data-note="Small releases every week, behind flags, with partners in the loop."><img alt="" src="/v2/assets/company-dot-ice7.svg">Ship every week</button>
        <button type="button" class="co-chip" aria-pressed="false" data-note="Partner managers spend time in stores and warehouses, not only on calls."><img alt="" src="/v2/assets/company-dot-ice7.svg">Meet partners in person</button>
      </div>
      </div>
      <div class="co-list" role="group" aria-label="Offices">
        <button type="button" class="co-office" aria-pressed="true" data-m="up" style="--d:150ms">
        <span class="co-office__l"><span class="co-office__city">Vilnius</span><span class="co-office__what">Head office · Product, engineering, pricing</span></span>
        <span class="co-office__r"><span class="co-time" data-tz="Europe/Vilnius">11:43 EET</span><span class="co-people">54 people</span></span>
      </button>
        <button type="button" class="co-office" aria-pressed="false" data-m="up" style="--d:250ms">
        <span class="co-office__l"><span class="co-office__city">Warsaw</span><span class="co-office__what">Partnerships and operations, Central Europe</span></span>
        <span class="co-office__r"><span class="co-time" data-tz="Europe/Warsaw">10:43 CET</span><span class="co-people">21 people</span></span>
      </button>
        <button type="button" class="co-office" aria-pressed="false" data-m="up" style="--d:350ms">
        <span class="co-office__l"><span class="co-office__city">Riga</span><span class="co-office__what">Buyer network and logistics, Baltics</span></span>
        <span class="co-office__r"><span class="co-time" data-tz="Europe/Riga">11:43 EET</span><span class="co-people">15 people</span></span>
      </button>
      </div>
    </div>
  </div>
</section>
