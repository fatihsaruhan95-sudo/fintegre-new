  [data-section="newsletter"] button { width: 350px; height: 52px; border: 0; border-radius: 999px; background: #3047EC; color: #F5F7FA; cursor: pointer;

  [data-section="newsletter"] .nl-note[data-state="bad"] { color: #C4373C; }
  [data-section="newsletter"] .nl-note[data-state="ok"] { color: #3047EC; }
  [data-section="newsletter"] .nl-vis { position: relative; width: 372px; height: 400px; margin-left: -20px; }
  [data-section="newsletter"] .gc { position: absolute; display: block; overflow: clip; isolation: isolate; line-height: normal; white-space: nowrap; }
  [data-section="newsletter"] .gc > * { position: absolute; display: block; max-width: none; margin: 0; }
  [data-section="newsletter"] .gc .lb-ph { transition: transform 1.2s var(--ease); }
  [data-section="newsletter"] .gc:hover .lb-ph { transform: scale(1.03); }
  [data-section="newsletter"] .gc-chip { display: flex !important; align-items: center; border-radius: 999px; color: #F5F7FA; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  [data-section="newsletter"] .gc-chip img { display: block; }
  [data-section="newsletter"] .gc-chip { display: none !important; }
  [data-section="newsletter"] .nl-cover { border-radius: 11.16px; box-shadow: 0 18.6px 37.2px -6.2px rgba(15,20,51,.22); }
  .motion [data-section="newsletter"] [data-m][data-ty] { translate: 0 var(--ty); }
  .motion [data-section="newsletter"].is-in [data-m][data-ty] { translate: none; }
</style>
