<section data-section="newsletter" id="newsletter" class="v2-sec" data-tone="light" style="--h:900px; background:#F5F7FA;">
<style>
  [data-section="newsletter"] .nl-abs { position: absolute; }
  [data-section="newsletter"] p { margin: 0; }
  [data-section="newsletter"] .nl-copy { left: 120px; top: 230px; display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
  [data-section="newsletter"] h2 { margin: 0; font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -0.04em; color: #0F1115; white-space: nowrap; }
  [data-section="newsletter"] .nl-lede { width: 470px; font-weight: 300; font-size: 18px; line-height: 1.55; color: rgba(15,17,21,.62); }
  [data-section="newsletter"] form { display: flex; gap: 10px; align-items: flex-start; }
  [data-section="newsletter"] input { width: 320px; height: 50px; padding: 0 22px; border-radius: 999px; border: 1px solid rgba(15,17,21,.1); background: #fff; color: #0F1115;
    font: 400 15px 'Geologica', system-ui, sans-serif; outline: none; transition: border-color .25s, box-shadow .25s; }
  [data-section="newsletter"] input::placeholder { color: rgba(15,17,21,.45); }
  [data-section="newsletter"] input:focus { border-color: #3047EC; box-shadow: 0 0 0 3px rgba(48,71,236,.15); }
  [data-section="newsletter"] input[aria-invalid="true"] { border-color: #E5484D; }
  [data-section="newsletter"] button { height: 50px; padding: 0 24px; border: 0; border-radius: 999px; background: #3047EC; color: #F5F7FA; cursor: pointer;
    font: 400 15px/normal 'Geologica', system-ui, sans-serif; transition: background-color .25s; }
  [data-section="newsletter"] button:hover { background: #2236C4; }
  [data-section="newsletter"] button[disabled] { background: #0F1115; cursor: default; }
  [data-section="newsletter"] .nl-note { font-size: 13px; color: rgba(15,17,21,.5); line-height: normal; white-space: nowrap; }
  [data-section="newsletter"] .nl-note a { color: #3047EC; text-decoration: underline; text-underline-offset: 2px; }
  [data-section="newsletter"] .nl-note[data-state="bad"] { color: #C4373C; }
  [data-section="newsletter"] .nl-note[data-state="ok"] { color: #3047EC; }
  [data-section="newsletter"] .nl-vis { left: 740px; top: 100px; width: 600px; height: 700px; }
  [data-section="newsletter"] .gc { position: absolute; display: block; overflow: clip; isolation: isolate; line-height: normal; white-space: nowrap; }
  [data-section="newsletter"] .gc > * { position: absolute; display: block; max-width: none; margin: 0; }
  [data-section="newsletter"] .gc .lb-ph { transition: transform 1.2s var(--ease); }
  [data-section="newsletter"] .gc:hover .lb-ph { transform: scale(1.03); }
  [data-section="newsletter"] .gc-chip { display: flex !important; align-items: center; border-radius: 999px; color: #F5F7FA; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  [data-section="newsletter"] .gc-chip img { display: block; }
  [data-section="newsletter"] .gc-chip { display: none !important; }
  [data-section="newsletter"] .nl-cover { border-radius: 18px; box-shadow: 0 30px 60px -10px rgba(15,20,51,.22); }
  .motion [data-section="newsletter"] [data-m][data-ty] { translate: 0 var(--ty); }
  .motion [data-section="newsletter"].is-in [data-m][data-ty] { translate: none; }
</style>
