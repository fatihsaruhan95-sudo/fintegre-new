<section data-section="fullbleed" id="fullbleed" class="v2-sec" data-tone="dark"
  style="--h:1000px; background: radial-gradient(45.45% 41.67% at 38.18% 45.83%, rgba(48,71,236,.45) 0%, rgba(48,71,236,.12) 55%, rgba(48,71,236,0) 100%), #0F1115;">
  <style>
    [data-section="fullbleed"] .fb-abs { position: absolute; }
    [data-section="fullbleed"] .fb-glow { left: -20px; top: 360px; width: 440px; height: 440px; }
    [data-section="fullbleed"] .fb-glow img { position: absolute; left: -160px; top: -160px; width: 760px; height: 760px; max-width: none; }
    [data-section="fullbleed"] .fb-wrap { display: flex; align-items: center; justify-content: center; }
    [data-section="fullbleed"] .fb-phone { position: relative; flex: none; transform: rotate(32deg);
      box-shadow: 0 0 64.8px 0 rgba(48,71,236,.35), 17.28px 28.8px 50.4px 0 rgba(0,0,0,.65); }
    [data-section="fullbleed"] .fb-phone img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; max-width: none; object-fit: cover; border-radius: inherit; }
    [data-section="fullbleed"] .fb-chip { left: 150px; top: 575px; display: flex; align-items: center; gap: 10px; padding: 13px 20px;
      border-radius: 999px; background: rgba(48,71,236,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 16px 40px 0 rgba(0,0,0,.4); font-size: 16px; font-weight: 400; line-height: normal; color: #fff; white-space: nowrap; }
    [data-section="fullbleed"] .fb-pill { display: flex; align-items: center; height: 36px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.12);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 13px; font-weight: 500; line-height: normal; color: rgba(255,255,255,.9); white-space: nowrap; }
    [data-section="fullbleed"] .fb-pill:active { background: rgba(255,255,255,.22); }
    [data-section="fullbleed"] .fb-cta { display: flex; align-items: center; height: 44px; padding: 12px 18px; border-radius: 10px; background: #fff; color: #0F1115;
      font-size: 14px; font-weight: 500; line-height: normal; }

    /* Motion (Figma mobile timeline, played once on arrival). */
    .motion [data-section="fullbleed"] .fb-glow { opacity: 0; transition: opacity 1.6s var(--ease) .3s; }
    .motion [data-section="fullbleed"].is-in .fb-glow { opacity: 1; }
    .motion [data-section="fullbleed"] .fb-old,
    .motion [data-section="fullbleed"] .fb-new { opacity: 0; transition: opacity .8s var(--ease) var(--d), translate 1.1s var(--ease) var(--d); }
    .motion [data-section="fullbleed"] .fb-old { --d: 300ms; translate: 80px 0; }
    .motion [data-section="fullbleed"] .fb-new { --d: 700ms; translate: 0 90px; }
    .motion [data-section="fullbleed"].is-in .fb-old,
    .motion [data-section="fullbleed"].is-in .fb-new { opacity: 1; translate: none; }
    .motion [data-section="fullbleed"]:not(.is-in) .fb-top[data-m] { translate: 0 30px; }
    .motion [data-section="fullbleed"]:not(.is-in) .fb-bottom[data-m] { translate: 0 24px; }
    .motion [data-section="fullbleed"] .fb-top[data-m],
    .motion [data-section="fullbleed"] .fb-bottom[data-m] { transition-duration: .72s, .9s, 1s, 1s; }
    .motion [data-section="fullbleed"] .fb-chip[data-m] { transition-duration: .3s, 1s, .5s, 1s; }
  </style>

  <div class="v2-canvas">
    <!-- Photo layer: glow + phones + credit chip (clipped to the frame) -->
    <div class="fb-abs" style="inset:0; overflow:clip; z-index:0;">
      <div class="fb-abs fb-glow" aria-hidden="true"><img alt="" src="assets/fullbleed-glow.svg" width="760" height="760"></div>

      <div class="fb-abs fb-wrap fb-old" style="left:45.88px; top:300px; width:364.101px; height:426.632px;">
        <div class="fb-phone" style="width:188.64px; height:385.2px; border-radius:31.68px;">
          <img alt="iPhone 13, the device being traded in" src="../assets/fullbleed-iphone13.webp">
        </div>
      </div>
      <div class="fb-abs fb-wrap fb-new" style="left:-150.53px; top:600px; width:384.171px; height:455.177px;">
        <div class="fb-phone" style="width:192.96px; height:416.16px; border-radius:33.12px;">
          <img alt="iPhone 18 Pro, the new device" src="../assets/fullbleed-iphone18pro.webp">
        </div>
      </div>

      <div class="fb-abs fb-chip" data-m="pop" style="--d:1800ms;">
        <img alt="" src="assets/fullbleed-dot.svg" width="8" height="8" style="display:block;">
        €240 credit · Instant
      </div>
    </div>

    <!-- Scrims -->
    <div class="fb-abs" aria-hidden="true" style="left:0; right:0; top:0; height:440px; z-index:1; pointer-events:none;
      background: radial-gradient(216.67px 169.23px at -21.67px 287.69px, rgba(0,0,0,.72) 0%, rgba(0,0,0,.4) 55%, rgba(0,0,0,0) 100%);"></div>
    <div class="fb-abs" aria-hidden="true" style="left:0; right:0; bottom:0; height:360px; z-index:1; pointer-events:none;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.75) 60%, rgba(0,0,0,.92) 100%);"></div>

    <div class="fb-abs fb-top" data-m="up" style="--d:100ms; left:20px; top:96px; z-index:2; display:flex; flex-direction:column; align-items:flex-start; gap:24px;">
      <h2 style="margin:0; width:350px; font-weight:400; font-size:40px; line-height:1.04; letter-spacing:-1px; color:#fff;">
        For markets that move <span style="font-family:'Instrument Serif', serif; font-style:italic;">faster</span> than your pricing.
      </h2>
      <a class="fb-cta" href="#closing">Talk to Fintegre</a>
    </div>

    <div class="fb-abs fb-bottom" data-m="up" style="--d:1200ms; left:20px; top:788px; z-index:2; display:flex; flex-direction:column; align-items:flex-start; gap:16px;">
      <p style="margin:0; width:350px; font-size:22px; font-weight:500; line-height:1.2; color:#fff;">Choose where to start,<br>whenever you are ready</p>
      <div style="display:flex; flex-wrap:wrap; gap:8px; width:350px;">
        <a class="fb-pill" href="#programs">Trade-in</a>
        <a class="fb-pill" href="#programs">Early upgrade</a>
        <a class="fb-pill" href="#programs">BYOD protection</a>
        <a class="fb-pill" href="#programs">Warranty extension</a>
        <a class="fb-pill" href="#programs">Claim validation</a>
      </div>
    </div>
  </div>
</section>
